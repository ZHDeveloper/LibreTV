name: Aggregate and validate IPTV lives

on:
  schedule:
    # 每天 UTC 19:00 (北京时间凌晨 03:00) 自动定时运行
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lives-aggregator
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install aiohttp

      - name: Aggregate, validate and group live streams
        run: python aggregate_lives.py

      - name: Check for changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- live ok-sources.json libretv-sources.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated live playlists
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live ok-sources.json libretv-sources.json
          git commit -m "chore: 自动更新聚合直播源 ($(date -u +%Y-%m-%d))"
          git push origin HEAD:main

      - name: Output summary report
        if: always()
        run: |
          if [ -f "live/summary.md" ]; then
            cat live/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
