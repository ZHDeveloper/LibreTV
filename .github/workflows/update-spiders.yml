name: Update spider mirrors

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: spider-mirror
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh mirrors from upstream
        run: python mirror_spiders.py

      - name: Check for changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- spiders ok-sources.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="spider-update/$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add spiders ok-sources.json
          git commit -m "chore: 自动更新 Spider 镜像"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: 自动更新 Spider 镜像" \
            --body "由 GitHub Actions 定时检查上游 Spider 包生成。请确认变更后合并。"
