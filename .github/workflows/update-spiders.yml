name: Update spider mirrors

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spider-mirror
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh mirrors from upstream
        run: python mirror_spiders.py

      - name: Check for changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain -- spiders ok-sources.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish update branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B spider-update
          git add spiders ok-sources.json
          git commit -m "chore: 自动更新 Spider 镜像 ($(date -u +%Y-%m-%d))"
          git push --force origin spider-update
          echo "### Spider 镜像有更新" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[查看并合并变更]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...spider-update?expand=1)" >> "$GITHUB_STEP_SUMMARY"
